# nginx/nginx.conf — used inside the frontend Docker container
# ─────────────────────────────────────────────────────────────────────────────
# Responsibilities:
#   1. Serve the React SPA static files
#   2. Handle client-side routing (try_files → index.html)
#   3. Proxy /api/... requests to the backend container
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;                          # Accept any hostname

    root /usr/share/nginx/html;             # Vite build output directory
    index index.html;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # ── Static asset caching ──────────────────────────────────────────────────
    # Vite generates content-hashed filenames (main.abc123.js) so we can cache
    # aggressively — the hash changes when content changes.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    # Requests to /api/... are forwarded to the backend service.
    # 'backend' resolves via Docker Compose's internal DNS.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── SPA catch-all ─────────────────────────────────────────────────────────
    # For every URL that doesn't match a real file, serve index.html.
    # This lets React Router handle client-side navigation (e.g. /products/123).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Docker health check endpoint ──────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
