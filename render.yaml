# render.yaml — Blueprint for Render.com deployment
# ─────────────────────────────────────────────────────────────────────────────
# This file automates the creation of the database, backend, and frontend
# services on Render using the latest possible versions.
# ─────────────────────────────────────────────────────────────────────────────

databases:
  # ── PostgreSQL Database (v18) ───────────────────────────────────────────────
  - name: shopwave-db
    plan: free
    region: singapore
    ipAllowList: []
    postgresMajorVersion: 18           # Using requested latest version

services:
  # ── FastAPI Backend (Python 3.14) ──────────────────────────────────────────
  - type: web
    name: shopwave-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopwave-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.14.0                  # Using requested latest version
      - key: DEBUG
        value: "false"
      - key: BACKEND_CORS_ORIGINS
        value: "https://shopwave-frontend-ffk1.onrender.com,http://localhost:3000,http://localhost:5173"

  # ── React Frontend (SPA) ───────────────────────────────────────────────────
  - type: web
    name: shopwave-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://shopwave-backend-ffk1.onrender.com"
      - key: NODE_VERSION
        value: "20.11.0"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
